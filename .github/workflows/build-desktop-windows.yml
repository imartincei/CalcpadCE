name: Build Desktop (Windows)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    env:
      CALCPAD_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Calcpad.Web/frontend/calcpad-desktop/src-tauri

      - name: Install frontend dependencies
        run: |
          npm ci --prefix Calcpad.Web/frontend/calcpad-frontend
          npm ci --prefix Calcpad.Web/frontend/calcpad-web
          npm ci --prefix Calcpad.Web/frontend/calcpad-desktop

      - name: Build desktop installers (Tauri)
        working-directory: Calcpad.Web/frontend/calcpad-desktop
        shell: pwsh
        run: ./build-desktop.ps1

      - name: Test runtime prerequisites
        working-directory: Calcpad.Web/frontend/calcpad-desktop
        shell: powershell
        run: ./packaging/windows/install-dotnet.test.ps1

      - name: Build portable
        working-directory: Calcpad.Web/frontend/calcpad-desktop
        shell: pwsh
        run: ./build-portable.ps1

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $bundle = 'Calcpad.Web/frontend/calcpad-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          Copy-Item "$bundle/msi/CalcpadCE_${env:CALCPAD_VERSION}_x64_en-US.msi" -Destination "artifacts/CalcpadCE-desktop-$env:CALCPAD_VERSION-x64.msi"
          Copy-Item "$bundle/nsis/CalcpadCE_${env:CALCPAD_VERSION}_x64-setup.exe" -Destination "artifacts/CalcpadCE-desktop-$env:CALCPAD_VERSION-x64-setup.exe"
          Copy-Item "Calcpad.Web/frontend/calcpad-desktop/src-tauri/target/portable/CalcpadCE-portable-${{ inputs.version }}.zip" `
            -Destination "artifacts/CalcpadCE-portable-${{ inputs.version }}.zip"

      - name: Verify third-party notices
        shell: bash
        run: ./tools/license-scan/verify-notices.sh "artifacts/CalcpadCE-portable-${{ inputs.version }}.zip"

      - name: Upload MSI installer
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/CalcpadCE-desktop-${{ inputs.version }}-x64.msi
          archive: false
          if-no-files-found: error

      - name: Upload EXE installer
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/CalcpadCE-desktop-${{ inputs.version }}-x64-setup.exe
          archive: false
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/CalcpadCE-portable-${{ inputs.version }}.zip
          archive: false
          if-no-files-found: error
