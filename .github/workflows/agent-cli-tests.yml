name: Agent CLI Integration Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-integration:
    name: CLI integration (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run process-level CLI tests
        run: dotnet test Calcpad.Cli.Tests/Calcpad.Cli.Tests.csproj --logger "console;verbosity=normal" --logger "trx;LogFileName=agent-cli.trx" --results-directory test-results

      - name: Upload machine-readable test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-cli-test-results-${{ matrix.os }}-${{ matrix.arch }}
          path: test-results/agent-cli.trx
          if-no-files-found: warn
