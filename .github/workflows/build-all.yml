name: Build All

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-desktop-windows:
    uses: ./.github/workflows/build-desktop-windows.yml
    with:
      version: ${{ inputs.version }}

  build-desktop-linux:
    uses: ./.github/workflows/build-desktop-linux.yml
    with:
      version: ${{ inputs.version }}

  build-vscode-extension:
    uses: ./.github/workflows/build-vscode-extension.yml
    with:
      version: ${{ inputs.version }}

  build-cli-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        working-directory: Calcpad.Cli
        run: dotnet restore Calcpad.Cli.csproj -r ${{ matrix.rid }}

      - name: Stage Examples for packaging
        shell: bash
        run: |
          rm -rf Calcpad.Cli/.pkg/Examples
          mkdir -p Calcpad.Cli/.pkg/Examples
          cp -a Examples/. Calcpad.Cli/.pkg/Examples/

      - name: Build .deb package
        working-directory: Calcpad.Cli
        run: >
          dotnet msbuild Calcpad.Cli.csproj
          -t:CreateDeb
          -p:Configuration=Release
          -p:Version=${{ inputs.version }}
          -p:PackagePrefix=CalcpadCE
          -p:ExamplesContentDir=.pkg/Examples
          -p:RuntimeIdentifier=${{ matrix.rid }}

      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp Calcpad.Cli/bin/Release/net10.0/${{ matrix.rid }}/*.deb \
            "artifacts/CalcpadCE-cli-${{ inputs.version }}-${{ matrix.rid }}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/*
          archive: false

  build-cli-rpm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Restore packages
        working-directory: Calcpad.Cli
        run: dotnet restore Calcpad.Cli.csproj -r ${{ matrix.rid }}

      - name: Stage root Examples for packaging
        shell: bash
        run: |
          rm -rf Calcpad.Cli/.pkg/Examples
          mkdir -p Calcpad.Cli/.pkg/Examples
          cp -a Examples/. Calcpad.Cli/.pkg/Examples/

      - name: Build .rpm package
        working-directory: Calcpad.Cli
        run: >
          dotnet msbuild Calcpad.Cli.csproj
          -t:CreateRpm
          -p:Configuration=Release
          -p:Version=${{ inputs.version }}
          -p:PackagePrefix=CalcpadCE
          -p:ExamplesContentDir=.pkg/Examples
          -p:RuntimeIdentifier=${{ matrix.rid }}

      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp Calcpad.Cli/bin/Release/net10.0/${{ matrix.rid }}/*.rpm \
            "artifacts/CalcpadCE-cli-${{ inputs.version }}-${{ matrix.rid }}.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/*
          archive: false

  build-cli-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Cache wkhtmltopdf
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\CalcpadCE\tools
          key: wkhtmltopdf-0.12.6-1-win64

      - name: Publish self-contained
        run: >
          dotnet publish Calcpad.Cli/Calcpad.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ inputs.version }}
          -o "CalcpadCE-cli-${{ inputs.version }}-win-x64"

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path "CalcpadCE-cli-${{ inputs.version }}-win-x64" -DestinationPath "CalcpadCE-cli-${{ inputs.version }}-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: '*.zip'
          archive: false

  build-cli-tarball:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained
        run: >
          dotnet publish Calcpad.Cli/Calcpad.Cli.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ inputs.version }}
          -o "CalcpadCE-cli-${{ inputs.version }}-${{ matrix.rid }}"

      - name: Create tarball
        run: tar cjf "CalcpadCE-cli-${{ inputs.version }}-${{ matrix.rid }}.tar.bz2" CalcpadCE-cli-${{ inputs.version }}-${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: '*.tar.bz2'
          archive: false
