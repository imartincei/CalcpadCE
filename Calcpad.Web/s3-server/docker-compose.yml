services:
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      # S3 API, exposed for debugging with the aws CLI.
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
    networks:
      - calcpad-s3
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 30

  garage-init:
    image: dxflrs/garage:v2.1.0
    depends_on:
      garage:
        condition: service_healthy
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_RPC_HOST=garage:3901
      - CALCPAD_KEY_NAME=${CALCPAD_KEY_NAME:-calcpad-s3-server}
      - CALCPAD_CREDS_FILE=/shared/garage-creds.env
    volumes:
      - ./garage-init.sh:/init.sh:ro
      - garage-creds:/shared
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    networks:
      - calcpad-s3

  s3-server:
    build:
      context: ../..
      dockerfile: Calcpad.Web/s3-server/Dockerfile
    ports:
      - "${S3_SERVER_PORT:-9430}:8080"
    environment:
      - Jwt__Secret=${JWT_SECRET:?set JWT_SECRET in .env}
      - Admin__Username=${ADMIN_USERNAME:-admin}
      - Admin__Password=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      garage-init:
        condition: service_completed_successfully
    volumes:
      - s3-server-data:/app/data
      - garage-creds:/garage-creds:ro
    # Load the S3 key garage-init generated.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -a; . /garage-creds/garage-creds.env; set +a
        exec dotnet Calcpad.S3Server.dll
    restart: unless-stopped
    networks:
      - calcpad-s3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  calcpad-s3:

volumes:
  s3-server-data:
  garage-meta:
  garage-data:
  garage-creds:
